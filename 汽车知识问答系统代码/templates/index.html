<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汽车知识问答系统</title>
    <!-- 使用Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v=3) }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light navbar-app">
        <div class="container">
            <a class="navbar-brand" href="/">
                <span class="logo">汽车知识</span> <span class="version">v2.0</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="/">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/faq">常见问题</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/feedback">用户反馈</a>
                    </li>
                </ul>
                <div class="d-flex">
                    <a href="/admin" class="nav-link nav-strong">管理员入口</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="qa-container">
            <h2 class="text-center mb-4">汽车知识问答</h2>
            
            <!-- 模型选择（色块随点击滑动） -->
            <div class="model-selector mb-3">
                <div class="d-flex justify-content-between align-items-center w-100 flex-wrap gap-2">
                    <div class="model-tabs" id="model-tabs">
                        <div class="model-thumb" id="model-thumb"></div>
                        <button type="button" class="model-tab active" data-model="offline">内置回答</button>
                        <button type="button" class="model-tab" data-model="zhipu">智谱GLM</button>
                        <button type="button" class="model-tab" data-model="openai">OpenAI</button>
                    </div>
                    <span class="badge bg-success" id="model-status">已连接</span>
                </div>
            </div>
            
            <!-- 聊天容器 -->
            <div class="chat-container" id="chat-container">
                <div class="bot-message message">
                    <p>您好！我是汽车知识助手，请问有什么关于汽车的问题需要帮助吗？</p>
                </div>
                <!-- 动态添加消息 -->
            </div>
            
            <!-- 输入框 -->
            <div class="input-group mb-3">
                <input type="text" class="form-control" id="question-input" placeholder="请输入您的问题..." aria-label="用户问题">
                <button class="btn btn-primary" type="button" id="ask-button">
                    发送
                </button>
            </div>
            
            <!-- 快速问题 -->
            <div class="quick-questions mt-3">
                <p class="text-muted mb-2">快速问题：</p>
                <div class="d-flex flex-wrap gap-2">
                    <button class="btn btn-sm btn-outline-secondary quick-question-btn">汽车如何保养？</button>
                    <button class="btn btn-sm btn-outline-secondary quick-question-btn">汽车发动机工作原理？</button>
                    <button class="btn btn-sm btn-outline-secondary quick-question-btn">电动汽车和燃油车的区别？</button>
                    <button class="btn btn-sm btn-outline-secondary quick-question-btn">如何延长轮胎使用寿命？</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer mt-5 py-3 bg-light">
        <div class="container text-center">
            <span class="text-muted">© 2025 汽车知识问答系统</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const chatContainer = document.getElementById('chat-container');
            const questionInput = document.getElementById('question-input');
            const askButton = document.getElementById('ask-button');
            const modelTabs = document.querySelectorAll('.model-tab');
            const modelThumb = document.getElementById('model-thumb');
            const modelStatus = document.getElementById('model-status');
            const quickQuestionBtns = document.querySelectorAll('.quick-question-btn');
            
            let currentModel = 'offline';
            
            // 检查是否有待处理的问题（从管理页面过来）
            const pendingQuestion = localStorage.getItem('pendingQuestion');
            if (pendingQuestion) {
                questionInput.value = pendingQuestion;
                localStorage.removeItem('pendingQuestion');
            }
            
            // 色块滑动到当前选中的模型选项
            function moveThumb(btn) {
                modelThumb.style.width = btn.offsetWidth + 'px';
                modelThumb.style.transform = 'translateX(' + (btn.offsetLeft - 4) + 'px)';
            }
            
            // 选择模型：色块滑动 + 更新状态角标
            function selectModel(btn) {
                modelTabs.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                moveThumb(btn);
                currentModel = btn.dataset.model;
                checkModelStatus(currentModel);
            }
            
            modelTabs.forEach(btn => {
                btn.addEventListener('click', function() {
                    selectModel(this);
                });
            });
            
            // 初始定位色块，窗口变化时重新对齐
            moveThumb(document.querySelector('.model-tab.active'));
            window.addEventListener('resize', function() {
                moveThumb(document.querySelector('.model-tab.active'));
            });
            
            // 发送按钮点击事件
            askButton.addEventListener('click', function() {
                sendQuestion();
            });
            
            // 输入框回车事件
            questionInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendQuestion();
                }
            });
            
            // 快速问题点击事件
            quickQuestionBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    questionInput.value = this.textContent;
                    sendQuestion();
                });
            });
            
            // 发送问题函数
            function sendQuestion() {
                const question = questionInput.value.trim();
                if (question === '') return;
                
                // 添加用户问题
                addMessage(question, 'user');
                
                // 显示加载中
                const loadingId = addLoadingMessage();
                
                // 调用API获取回答
                fetch('/ask', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        question: question,
                        model: currentModel
                    }),
                })
                .then(response => response.json())
                .then(data => {
                    // 移除加载消息
                    removeLoadingMessage(loadingId);
                    
                    // 添加机器人回答（附带来源标注）
                    addMessage(data.answer, 'bot', data.model_used);
                })
                .catch(error => {
                    console.error('Error:', error);
                    removeLoadingMessage(loadingId);
                    addMessage('抱歉，发生了错误，请稍后再试。', 'bot');
                });
                
                // 清空输入框
                questionInput.value = '';
            }
            
            // 添加消息到聊天框（bot 消息可带来源标注，如“智谱GLM · glm-4.5-air”）
            function addMessage(text, sender, modelUsed) {
                const messageDiv = document.createElement('div');
                messageDiv.className = sender === 'user' ? 'user-message message' : 'bot-message message';
                
                const paragraph = document.createElement('p');
                paragraph.textContent = text;
                
                messageDiv.appendChild(paragraph);

                if (sender === 'bot' && modelUsed) {
                    const tag = document.createElement('div');
                    tag.className = 'answer-source';
                    tag.textContent = '来源：' + modelUsed;
                    messageDiv.appendChild(tag);
                }
                chatContainer.appendChild(messageDiv);
                
                // 滚动到底部
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
            
            // 添加加载中消息
            function addLoadingMessage() {
                const id = 'loading-' + Date.now();
                const loadingDiv = document.createElement('div');
                loadingDiv.className = 'bot-message message';
                loadingDiv.id = id;
                
                const loadingText = document.createElement('p');
                loadingText.innerHTML = '思考中<span class="loading"></span>';
                
                loadingDiv.appendChild(loadingText);
                chatContainer.appendChild(loadingDiv);
                
                // 滚动到底部
                chatContainer.scrollTop = chatContainer.scrollHeight;
                
                return id;
            }
            
            // 移除加载中消息
            function removeLoadingMessage(id) {
                const loadingElement = document.getElementById(id);
                if (loadingElement) {
                    loadingElement.remove();
                }
            }
            
            // 检查模型状态
            function checkModelStatus(model) {
                fetch('/check_model', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ model: model }),
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'available') {
                        modelStatus.className = 'badge bg-success';
                        modelStatus.textContent = '已连接';
                    } else {
                        modelStatus.className = 'badge bg-danger';
                        modelStatus.textContent = '未连接';
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    modelStatus.className = 'badge bg-warning';
                    modelStatus.textContent = '状态未知';
                });
            }
            
            // 初始检查模型状态
            checkModelStatus(currentModel);
        });
    </script>
</body>
</html>
