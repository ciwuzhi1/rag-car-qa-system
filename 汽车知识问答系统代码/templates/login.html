<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汽车知识问答系统 - 登录</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #eef2f7 0%, #e3ecf7 45%, #eef7f3 100%) fixed;
        }
        .login-container {
            background-color: white;
            padding: 2.4rem 2.2rem;
            border-radius: 16px;
            border: 1px solid #E9EAEE;
            box-shadow: 0 12px 40px rgba(31, 41, 72, 0.10);
            width: 340px;
            position: relative;
        }
        .login-container::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 28px;
            right: 28px;
            height: 3px;
            border-radius: 0 0 4px 4px;
            background: linear-gradient(90deg, #4D6BFE, #8A6BFF);
        }
        .login-title {
            text-align: center;
            margin-bottom: 0.5rem;
            color: #26282E;
            font-size: 1.7rem;
            font-weight: 700;
        }
        .system-subtitle {
            text-align: center;
            color: #9CA3AF;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #4B5563;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #DDE0E6;
            border-radius: 8px;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-group input:focus {
            border-color: #4D6BFE;
            outline: none;
            box-shadow: 0 0 0 3px rgba(77, 107, 254, 0.14);
        }
        .login-btn {
            width: 100%;
            padding: 0.8rem;
            background: #EDF1FF;
            color: #3D5BE0;
            border: 1px solid #C9D6FE;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.2s;
        }
        .login-btn:hover {
            background: #E0E8FF;
            border-color: #A9BEFD;
            color: #2F4BD0;
        }
        .error-message {
            color: #e74c3c;
            text-align: center;
            margin-top: 1rem;
        }
        .login-tip {
            text-align: center;
            color: #95a5a6;
            font-size: 0.85rem;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2 class="login-title">汽车知识问答系统</h2>
        <p class="system-subtitle">后台管理系统</p>
        <form action="/login" method="post">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" required placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required placeholder="请输入密码">
            </div>
            <button type="submit" class="login-btn">登录</button>
            {% if error %}
            <div class="error-message">{{ error }}</div>
            {% endif %}
        </form>
        <p class="login-tip">默认账号：admin / admin123（可通过环境变量 ADMIN_USERNAME / ADMIN_PASSWORD 修改）</p>
    </div>
</body>
</html>
